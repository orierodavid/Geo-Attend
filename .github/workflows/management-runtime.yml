name: Management Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  management:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli,mbstring
          tools: wp-cli
      - name: Install WordPress
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wp"
          cd "$RUNNER_TEMP/wp"
          wp core download --version=6.8.2
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --url=http://localhost --title='Geo-Attend Management Runtime' --admin_user=admin --admin_password='test-password-123!' --admin_email=test@example.com --skip-email
          mkdir -p wp-content/plugins/geo-attend
          cp -R "$GITHUB_WORKSPACE"/. wp-content/plugins/geo-attend/
      - name: PHP syntax
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/wp/wp-content/plugins/geo-attend" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify management registration and schema
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wp"
          wp plugin activate geo-attend
          wp eval '
            global $wpdb;
            $members = $wpdb->prefix . "geo_attend_members";
            $columns = $wpdb->get_col("SHOW COLUMNS FROM {$members}", 0);
            if (!in_array("location_id", $columns, true)) { fwrite(STDERR, "location_id missing from members schema\\n"); exit(1); }
            if (false === has_action("admin_post_geo_staff_create_account")) { fwrite(STDERR, "staff account handler missing\\n"); exit(1); }
            if (false === has_action("admin_post_geo_staff_create_task")) { fwrite(STDERR, "task handler missing\\n"); exit(1); }
            do_action("admin_menu");
            global $submenu;
            $slugs = array();
            foreach ((array) ($submenu["geo-attend"] ?? array()) as $item) { $slugs[] = $item[2]; }
            if (!in_array("geo-attend-staff", $slugs, true) || !in_array("geo-attend-tasks", $slugs, true)) { fwrite(STDERR, "management admin pages not registered\\n"); exit(1); }
            echo "Management registration/schema passed.\\n";
          '
      - name: Verify staff linkage and task notification contract
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wp"
          wp eval '
            global $wpdb;
            $t = Geo_Attend_DB::tables();
            $now = current_time("mysql");
            $wpdb->insert($t["departments"], array("name"=>"Management Test","active"=>1,"created_at"=>$now,"updated_at"=>$now), array("%s","%d","%s","%s"));
            $department = (int)$wpdb->insert_id;
            $wpdb->insert($t["locations"], array("name"=>"Management Office","latitude"=>6.5244,"longitude"=>3.3792,"radius_meters"=>100,"active"=>1,"created_at"=>$now,"updated_at"=>$now), array("%s","%f","%f","%f","%d","%s","%s"));
            $location = (int)$wpdb->insert_id;
            $user = wp_insert_user(array("user_login"=>"management.staff","user_pass"=>"TempPass123!","user_email"=>"management.staff@example.com","first_name"=>"Management","last_name"=>"Staff","role"=>"geo_staff"));
            if (is_wp_error($user)) { throw new Exception($user->get_error_message()); }
            $wpdb->insert($t["members"], array("user_id"=>$user,"email"=>"management.staff@example.com","department_id"=>$department,"location_id"=>$location,"first_name"=>"Management","last_name"=>"Staff","pin_hash"=>"","active"=>1,"created_at"=>$now,"updated_at"=>$now), array("%d","%s","%d","%d","%s","%s","%s","%d","%s","%s"));
            $member = $wpdb->get_row($wpdb->prepare("SELECT department_id,location_id FROM {$t["members"]} WHERE user_id=%d",$user), ARRAY_A);
            if (!$member || (int)$member["department_id"] !== $department || (int)$member["location_id"] !== $location) { fwrite(STDERR, "staff department/location linkage failed\\n"); exit(1); }
            $ref = new ReflectionMethod("Geo_Attend_Management", "send_task_email");
            $ref->setAccessible(true);
            add_filter("pre_wp_mail", function($null){ return true; });
            $wpdb->insert($t["tasks"], array("title"=>"Management runtime task","description"=>"Test notification","assigned_user_id"=>$user,"created_by"=>1,"priority"=>"high","status"=>"todo","created_at"=>$now,"updated_at"=>$now), array("%s","%s","%d","%d","%s","%s","%s","%s"));
            $task = (int)$wpdb->insert_id;
            if (!$task || !$ref->invoke(null,$user,$task)) { fwrite(STDERR, "task notification contract failed\\n"); exit(1); }
            echo "Staff linkage and task notification contract passed.\\n";
          '
