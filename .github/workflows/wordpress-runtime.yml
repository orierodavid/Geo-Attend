name: WordPress Runtime

on:
  push:
    branches: [wordpress-integration-test, wordpress-conversion, staff-portal-auth]
  pull_request:
    branches: [wordpress-conversion, main]

jobs:
  runtime:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring
          tools: wp-cli
          coverage: none
      - name: Install WordPress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wp"
          cd "$RUNNER_TEMP/wp"
          wp core download --version=6.8.2 --force
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --url=http://localhost --title='Geo-Attend Runtime Test' --admin_user=admin --admin_password='test-password-123!' --admin_email=test@example.com --skip-email
          mkdir -p wp-content/plugins/geo-attend
          cp -R "$GITHUB_WORKSPACE"/. wp-content/plugins/geo-attend/
      - name: Activate plugin and verify schema
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wp"
          wp plugin activate geo-attend
          wp eval '
            global $wpdb;
            $tables = array(
              $wpdb->prefix . "geo_attend_departments",
              $wpdb->prefix . "geo_attend_members",
              $wpdb->prefix . "geo_attend_locations",
              $wpdb->prefix . "geo_attend_attendance",
              $wpdb->prefix . "geo_attend_projects",
              $wpdb->prefix . "geo_attend_tasks"
            );
            foreach ($tables as $table) { if ($wpdb->get_var($wpdb->prepare("SHOW TABLES LIKE %s", $table)) !== $table) { fwrite(STDERR, "Missing table: $table\\n"); exit(1); } }
            if (false === get_option("geo_attend_settings", false)) { fwrite(STDERR, "Missing settings option\\n"); exit(1); }
            if (!get_role("geo_staff")) { fwrite(STDERR, "Missing geo_staff role\\n"); exit(1); }
            if (!shortcode_exists("geo_attend")) { fwrite(STDERR, "Attendance shortcode not registered\\n"); exit(1); }
            if (!shortcode_exists("geo_staff_portal")) { fwrite(STDERR, "Staff portal shortcode not registered\\n"); exit(1); }
            echo "Schema/bootstrap checks passed.\\n";
          '
      - name: Exercise REST API and geofence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wp"
          wp eval '
            global $wpdb;
            $t = Geo_Attend_DB::tables();
            $now = Geo_Attend_DB::now();
            $day = $now->format("l");
            $settings = get_option("geo_attend_settings", array());
            $settings["attendance_days"] = array($day);
            $settings["start_time"] = "00:00";
            $settings["end_time"] = "23:59";
            $settings["late_after"] = 15;
            $settings["max_accuracy"] = 100;
            update_option("geo_attend_settings", $settings);
            $now_sql = current_time("mysql");
            $wpdb->insert($t["departments"], array("name" => "Choir", "active" => 1, "created_at" => $now_sql, "updated_at" => $now_sql), array("%s", "%d", "%s", "%s"));
            $department_id = (int) $wpdb->insert_id;
            if (!$department_id) { fwrite(STDERR, "Department insert failed\\n"); exit(1); }
            $wpdb->insert($t["members"], array("department_id" => $department_id, "first_name" => "Runtime", "last_name" => "Member", "pin_hash" => wp_hash_password("1234"), "active" => 1, "created_at" => $now_sql, "updated_at" => $now_sql), array("%d", "%s", "%s", "%s", "%d", "%s", "%s"));
            $member_id = (int) $wpdb->insert_id;
            if (!$member_id) { fwrite(STDERR, "Member insert failed\\n"); exit(1); }
            $wpdb->insert($t["locations"], array("name" => "Runtime Location", "latitude" => 6.5244, "longitude" => 3.3792, "radius_meters" => 100, "active" => 1, "created_at" => $now_sql, "updated_at" => $now_sql), array("%s", "%f", "%f", "%f", "%d", "%s", "%s"));
            $location_id = (int) $wpdb->insert_id;
            if (!$location_id) { fwrite(STDERR, "Location insert failed\\n"); exit(1); }
            $request = new WP_REST_Request("POST", "/geo-attend/v1/check-in");
            $request->set_header("Content-Type", "application/json");
            $request->set_body(wp_json_encode(array("member_name" => "Runtime Member", "pin" => "1234", "lat" => 6.5244, "lng" => 3.3792, "accuracy" => 10)));
            $response = rest_do_request($request);
            if ($response->get_status() !== 200) { fwrite(STDERR, "Valid name+PIN check-in failed: ".wp_json_encode($response->get_data())."\\n"); exit(1); }
            $record = $wpdb->get_row($wpdb->prepare("SELECT member_id, department_id, location_id FROM {$t["attendance"]} WHERE member_id = %d ORDER BY id DESC LIMIT 1", $member_id), ARRAY_A);
            if (!$record || (int)$record["member_id"] !== $member_id || (int)$record["department_id"] !== $department_id || (int)$record["location_id"] !== $location_id) { fwrite(STDERR, "Attendance identity/department/location linkage failed.\\n"); exit(1); }
            $duplicate = rest_do_request($request);
            if ($duplicate->get_status() !== 409) { fwrite(STDERR, "Duplicate check-in did not return 409: ".wp_json_encode($duplicate->get_data())."\\n"); exit(1); }
            $wpdb->delete($t["attendance"], array("member_id" => $member_id, "attendance_date" => $now->format("Y-m-d")), array("%d", "%s"));
            $outside = new WP_REST_Request("POST", "/geo-attend/v1/check-in");
            $outside->set_header("Content-Type", "application/json");
            $outside->set_body(wp_json_encode(array("member_name" => "Runtime Member", "pin" => "1234", "lat" => 6.5244, "lng" => 3.3892, "accuracy" => 10)));
            $outside_response = rest_do_request($outside);
            if ($outside_response->get_status() !== 403) { fwrite(STDERR, "Outside geofence did not return 403: ".wp_json_encode($outside_response->get_data())."\\n"); exit(1); }
            $config = rest_do_request(new WP_REST_Request("GET", "/geo-attend/v1/config"));
            if ($config->get_status() !== 200) { fwrite(STDERR, "Config endpoint failed\\n"); exit(1); }
            echo "REST/name+PIN/geofence/department checks passed.\\n";
          '
      - name: Verify uninstall cleanup
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wp"
          wp plugin deactivate geo-attend
          wp eval 'define("WP_UNINSTALL_PLUGIN", true); require WP_PLUGIN_DIR . "/geo-attend/uninstall.php";'
          wp eval '
            global $wpdb;
            $tables = array(
              $wpdb->prefix . "geo_attend_departments",
              $wpdb->prefix . "geo_attend_members",
              $wpdb->prefix . "geo_attend_locations",
              $wpdb->prefix . "geo_attend_attendance",
              $wpdb->prefix . "geo_attend_projects",
              $wpdb->prefix . "geo_attend_tasks"
            );
            foreach ($tables as $table) { if ($wpdb->get_var($wpdb->prepare("SHOW TABLES LIKE %s", $table)) === $table) { fwrite(STDERR, "Table remains after uninstall: $table\\n"); exit(1); } }
            if (false !== get_option("geo_attend_settings", false)) { fwrite(STDERR, "Settings option remains after uninstall\\n"); exit(1); }
            if (false !== get_option("geo_attend_staff_portal_page_id", false)) { fwrite(STDERR, "Staff portal page option remains after uninstall\\n"); exit(1); }
            if (get_role("geo_staff")) { fwrite(STDERR, "geo_staff role remains after uninstall\\n"); exit(1); }
            echo "Uninstall cleanup passed.\\n";
          '
